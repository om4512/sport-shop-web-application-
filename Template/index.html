<!DOCTYPE html>
<html lang="en">
<head>
  <title>KRIDA- Products </title>
</head>
<body>
  <h1> All Products</h1>
  <a href="{{url_for('add_equipment')}}">➕ Add Product</a>
  <table border="1" cellpadding="10">
    <tr>
      <th> ID </th><th> Name</th><th> Category</th><th> Description</th><th> Price</th><th> Stock </th>
      <th> Actions</th>
    </tr>
    {%for equipment in equipment %}
    <tr>
      <td>{{ equipment.id}}</td>
      <td>{{ equipment.name}}</td>
      <td>{{ equipment.category}}</td>
      <td>{{ equipment.description}}</td>
      <td>{{ equipment.price}}</td>
      <td>{{equipment.stock}}</td>
      <td>
      <a href="{{ url_for('update_product', id=equipment.id)}}"> ✏ Edit</a>
      <a href="{{ url_for('delete_product', id=equipment.id)}}"> 🗑 Delete</a>
      </td>
    </tr>
    {% endfor %}
  </table>
</body>
</html>
